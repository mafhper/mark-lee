name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Desktop Web Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check contrast
        run: npm run contrast:check

      - name: Check public surface
        run: npm run surface:check

      # O alinhamento npm x crate das dependencias do Tauri. So' o `tauri build`
      # aplica esta regra, e nenhum job de CI o roda — foi assim que um bump de
      # npm passou verde aqui e matou o release nos tres runners.
      - name: Check Tauri dependency alignment
        run: npm run tauri:check

      - name: Test journal media and organization
        run: |
          npm run test:image-markdown
          npm run test:preprocess-markdown
          npm run test:journal-entry
          npm run test:journal-images
          npm run test:journal-tasks
          npm run test:journal-order
          npm run test:export-html
          npm run test:search-options
          npm run test:search-phrases
          npm run test:release-workflow
          npm run test:cache-evictor
          node scripts/release-version.test.mjs

      - name: Build web
        run: npm run build

  site:
    name: Site Build, Check & Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/site/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm ci
        working-directory: apps/site

      # O `playwright install` baixa chromium + headless shell + ffmpeg (~300 MB
      # medidos no log do job) e depende do cdn.playwright.dev em todo run. A
      # chave carrega a versão do Playwright resolvida no `package-lock.json`:
      # um bump de versão erra o cache de propósito, porque reaproveitar o
      # binário de outra revisão não acelera nada e ainda esconde o que o
      # `playwright install` teria baixado.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package-lock.json", "utf8")).packages["node_modules/playwright"].version' 2>/dev/null || true)
          if [ -z "$version" ]; then
            echo "Playwright version missing from package-lock.json; skipping the browser cache."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: steps.playwright.outputs.version != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npm run smoke:install-browser

      - name: Check site types
        run: npm run site:check
        env:
          SITE_BASE: /
          SITE_GITHUB_OWNER: ${{ github.repository_owner }}
          SITE_GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Build site
        run: npm run site:build
        env:
          SITE_BASE: /
          SITE_GITHUB_OWNER: ${{ github.repository_owner }}
          SITE_GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Smoke test site
        timeout-minutes: 8
        run: node scripts/smoke-site.mjs

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Cargo
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Só a `main` grava cache. Em PR a action continua RESTAURANDO, mas não SALVA,
          # o que evita uma entrada por refs/pull/<n>/merge (~1.28 GiB cada) e o estouro
          # dos 6 GiB do escopo. Versão do pin e `cache-on-failure` ficam como estavam.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: "./src-tauri -> target"

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      # `cargo test`, e não só `cargo check`.
      #
      # Os testes do Rust **já existiam** (`read_workspace_tree_omits_heavy_directories`,
      # no módulo de filesystem) e **nenhum job os executava**: um teste que não
      # roda é indistinguível de um teste que não existe, e o `check` só prova
      # que o código compila.
      #
      # O custo é o codegen do harness de teste — o `check` não o produz —, e é
      # o preço de o lado Rust ter alguma proteção de comportamento e não só de
      # tipos.
      - name: Cargo test
        run: cargo test --lib
        working-directory: src-tauri
