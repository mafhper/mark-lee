name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dmg_only:
        description: "Run only optional macOS DMG job"
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dmg_only != true }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauriArgs: --bundles app
          - platform: ubuntu-latest
            tauriArgs: ""
          - platform: windows-latest
            tauriArgs: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - id: release-body
        name: Build release body from per-version notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          minor="${version%.*}"
          minor_tag="v${minor}"
          notes_file=".github/release-notes/${minor_tag}.md"
          body_file="$RUNNER_TEMP/release-body.md"
          repo="${{ github.repository }}"
          img=""
          if [ -f "public/releases/release-feed-${minor}.png" ]; then
            img="public/releases/release-feed-${minor}.png"
          else
            latest_img="$(ls public/releases/release-feed-*.png 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$latest_img" ]; then img="$latest_img"; fi
          fi
          if [ -z "$img" ]; then
            img="apps/site/public/assets/product/og-mark-lee.png"
          fi
          {
            printf '%s\n' '<p align="center">'
            printf '%s\n' "  <img src=\"https://raw.githubusercontent.com/${repo}/${ref}/${img}\" alt=\"Mark-Lee Editor e Memórias\" width=\"960\">"
            printf '%s\n' '</p>'
            printf '%s\n' ''
            printf '%s\n' "Mark-Lee v${version} reúne um editor Markdown elegante e um espaço local-first de Memórias sobre os mesmos arquivos."
            if [ -f "$notes_file" ]; then
              printf '%s\n' ''
              printf '%s\n' '## Destaques'
              printf '%s\n' ''
              cat "$notes_file"
            fi
            printf '%s\n' ''
            printf '%s\n' '## Downloads'
            printf '%s\n' ''
            printf '%s\n' '| Plataforma | Download | Uso |'
            printf '%s\n' '| --- | --- | --- |'
            printf '%s\n' "| Windows x64 | [Instalador EXE](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_x64-setup.exe) | Instalação padrão |"
            printf '%s\n' "| Windows x64 | [Pacote MSI](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_x64_en-US.msi) | Implantação gerenciada |"
            printf '%s\n' "| macOS Apple Silicon | [DMG](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_aarch64.dmg) | Instalação gráfica |"
            printf '%s\n' "| macOS Apple Silicon | [Bundle .app](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_aarch64.app.tar.gz) | Distribuição manual |"
            printf '%s\n' "| Linux x64 | [AppImage](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_amd64.AppImage) | Aplicação portátil |"
            printf '%s\n' "| Debian/Ubuntu x64 | [Pacote DEB](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_amd64.deb) | Pacote nativo |"
            printf '%s\n' "| Fedora/RHEL x64 | [Pacote RPM](https://github.com/${repo}/releases/download/${ref}/Mark-Lee-${version}-1.x86_64.rpm) | Pacote nativo |"
            printf '%s\n' ''
            printf '%s\n' '<details>'
            printf '%s\n' '<summary>Outros detalhes de instalação</summary>'
            printf '%s\n' ''
            printf '%s\n' '- O instalador EXE é a opção recomendada para a maioria das pessoas no Windows.'
            printf '%s\n' '- O MSI serve para implantação gerenciada.'
            printf '%s\n' '- No macOS, arraste o Mark-Lee para a pasta Aplicativos.'
            printf '%s\n' ''
            printf '%s\n' '</details>'
            printf '%s\n' ''
            printf '%s\n' '---'
          } > "$body_file"
          generated="$(gh api "repos/${repo}/releases/generate-notes" -f tag_name="$ref" -f target_commitish="main" --jq '.body' 2>/dev/null || true)"
          if [ -n "$generated" ]; then
            {
              printf '%s\n' ''
              printf '%s\n' '<details>'
              printf '%s\n' '<summary>Lista de mudanças (gerada automaticamente)</summary>'
              printf '%s\n' ''
              printf '%s\n' "$generated"
              printf '%s\n' ''
              printf '%s\n' '</details>'
            } >> "$body_file"
          fi

          echo "wrote release body file ($(wc -c < "$body_file") bytes)"

      - id: create-release
        name: Resolve or create the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          body_file="$RUNNER_TEMP/release-body.md"
          for i in $(seq 1 24); do
            if id="$(gh release view "$ref" --json id --jq '.id' 2>/dev/null)"; then
              break
            fi
            if gh release create "$ref" --target main --title "Mark-Lee v${version}" --notes-file "$body_file" >/dev/null 2>&1; then
              echo "created release $ref"
            else
              echo "create attempt $i failed; retrying"
            fi
            sleep 5
          done
          if [ -z "${id:-}" ]; then
            echo "could not resolve or create release $ref" >&2
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "resolved release $ref"
          body="$(gh release view "$ref" --json body --jq '.body')"
          if [ -z "$body" ]; then
            echo "release body is empty; applying generated body"
            gh release edit "$ref" --notes-file "$body_file"
          fi
          echo "release body bytes: $(printf '%s' "$body" | wc -c)"

      - name: Build and Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauriArgs }}
          tagName: v__VERSION__ # tauri-action will replace this
          releaseName: 'Mark-Lee v__VERSION__'
          releaseId: ${{ steps.create-release.outputs.release_id }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false

  release-macos-dmg:
    name: Optional macOS DMG (non-blocking)
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './src-tauri -> target'

      - id: release-body
        name: Build release body from per-version notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          minor="${version%.*}"
          minor_tag="v${minor}"
          notes_file=".github/release-notes/${minor_tag}.md"
          body_file="$RUNNER_TEMP/release-body.md"
          repo="${{ github.repository }}"
          img=""
          if [ -f "public/releases/release-feed-${minor}.png" ]; then
            img="public/releases/release-feed-${minor}.png"
          else
            latest_img="$(ls public/releases/release-feed-*.png 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$latest_img" ]; then img="$latest_img"; fi
          fi
          if [ -z "$img" ]; then
            img="apps/site/public/assets/product/og-mark-lee.png"
          fi
          {
            printf '%s\n' '<p align="center">'
            printf '%s\n' "  <img src=\"https://raw.githubusercontent.com/${repo}/${ref}/${img}\" alt=\"Mark-Lee Editor e Memórias\" width=\"960\">"
            printf '%s\n' '</p>'
            printf '%s\n' ''
            printf '%s\n' "Mark-Lee v${version} reúne um editor Markdown elegante e um espaço local-first de Memórias sobre os mesmos arquivos."
            if [ -f "$notes_file" ]; then
              printf '%s\n' ''
              printf '%s\n' '## Destaques'
              printf '%s\n' ''
              cat "$notes_file"
            fi
            printf '%s\n' ''
            printf '%s\n' '## Downloads'
            printf '%s\n' ''
            printf '%s\n' '| Plataforma | Download | Uso |'
            printf '%s\n' '| --- | --- | --- |'
            printf '%s\n' "| Windows x64 | [Instalador EXE](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_x64-setup.exe) | Instalação padrão |"
            printf '%s\n' "| Windows x64 | [Pacote MSI](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_x64_en-US.msi) | Implantação gerenciada |"
            printf '%s\n' "| macOS Apple Silicon | [DMG](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_aarch64.dmg) | Instalação gráfica |"
            printf '%s\n' "| macOS Apple Silicon | [Bundle .app](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_aarch64.app.tar.gz) | Distribuição manual |"
            printf '%s\n' "| Linux x64 | [AppImage](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_amd64.AppImage) | Aplicação portátil |"
            printf '%s\n' "| Debian/Ubuntu x64 | [Pacote DEB](https://github.com/${repo}/releases/download/${ref}/Mark-Lee_${version}_amd64.deb) | Pacote nativo |"
            printf '%s\n' "| Fedora/RHEL x64 | [Pacote RPM](https://github.com/${repo}/releases/download/${ref}/Mark-Lee-${version}-1.x86_64.rpm) | Pacote nativo |"
            printf '%s\n' ''
            printf '%s\n' '<details>'
            printf '%s\n' '<summary>Outros detalhes de instalação</summary>'
            printf '%s\n' ''
            printf '%s\n' '- O instalador EXE é a opção recomendada para a maioria das pessoas no Windows.'
            printf '%s\n' '- O MSI serve para implantação gerenciada.'
            printf '%s\n' '- No macOS, arraste o Mark-Lee para a pasta Aplicativos.'
            printf '%s\n' ''
            printf '%s\n' '</details>'
            printf '%s\n' ''
            printf '%s\n' '---'
          } > "$body_file"
          generated="$(gh api "repos/${repo}/releases/generate-notes" -f tag_name="$ref" -f target_commitish="main" --jq '.body' 2>/dev/null || true)"
          if [ -n "$generated" ]; then
            {
              printf '%s\n' ''
              printf '%s\n' '<details>'
              printf '%s\n' '<summary>Lista de mudanças (gerada automaticamente)</summary>'
              printf '%s\n' ''
              printf '%s\n' "$generated"
              printf '%s\n' ''
              printf '%s\n' '</details>'
            } >> "$body_file"
          fi

          echo "wrote release body file ($(wc -c < "$body_file") bytes)"

      - id: create-release
        name: Resolve or create the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          body_file="$RUNNER_TEMP/release-body.md"
          for i in $(seq 1 24); do
            if id="$(gh release view "$ref" --json id --jq '.id' 2>/dev/null)"; then
              break
            fi
            if gh release create "$ref" --target main --title "Mark-Lee v${version}" --notes-file "$body_file" >/dev/null 2>&1; then
              echo "created release $ref"
            else
              echo "create attempt $i failed; retrying"
            fi
            sleep 5
          done
          if [ -z "${id:-}" ]; then
            echo "could not resolve or create release $ref" >&2
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "resolved release $ref"
          body="$(gh release view "$ref" --json body --jq '.body')"
          if [ -z "$body" ]; then
            echo "release body is empty; applying generated body"
            gh release edit "$ref" --notes-file "$body_file"
          fi
          echo "release body bytes: $(printf '%s' "$body" | wc -c)"

      - name: Build and attach DMG (optional)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles dmg
          tagName: v__VERSION__ # tauri-action will replace this
          releaseName: 'Mark-Lee v__VERSION__'
          releaseId: ${{ steps.create-release.outputs.release_id }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false

      - name: Collect DMG bundle logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/mark-lee-dmg-logs
          if [ -d "src-tauri/target/release/bundle/dmg" ]; then
            cp -R src-tauri/target/release/bundle/dmg /tmp/mark-lee-dmg-logs/
          fi
          if [ -f "src-tauri/target/release/bundle/dmg/bundle_dmg.sh" ]; then
            cp src-tauri/target/release/bundle/dmg/bundle_dmg.sh /tmp/mark-lee-dmg-logs/
          fi

      - name: Upload DMG failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-bundle-logs-${{ github.run_id }}
          path: /tmp/mark-lee-dmg-logs
          if-no-files-found: ignore