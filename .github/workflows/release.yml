name: Release

# The release protocol lives in release-core; this file only describes the project.
# Project-specific logic belongs in .github/release.config.json, not here.
# See .dev/projects/release-core.md for the adoption notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: mafhper/release-core/.github/workflows/release.yml@v1.2.4
    with:
      matrix: |-
        [
          { "os": "ubuntu-latest",  "args": "" },
          { "os": "windows-latest", "args": "" },
          { "os": "macos-latest",   "args": "--bundles app" }
        ]
