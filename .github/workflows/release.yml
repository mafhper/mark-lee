name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dmg_only:
        description: "Run only optional macOS DMG job"
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dmg_only != true }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauriArgs: --bundles app
          - platform: ubuntu-latest
            tauriArgs: ""
          - platform: windows-latest
            tauriArgs: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build and Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.tauriArgs }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Mark-Lee v__VERSION__'
          releaseBody: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/site/public/assets/product/og-mark-lee.png" alt="Mark-Lee Editor e Memórias" width="960">
            </p>

            Mark-Lee reúne um editor Markdown e um espaço local-first de Memórias sobre os mesmos arquivos.

            ## Downloads

            | Platform | Recommended file | Use |
            | --- | --- | --- |
            | Windows | `Mark-Lee_*_x64-setup.exe` | Standard installation |
            | Windows | `Mark-Lee_*_x64_en-US.msi` | Managed deployment |
            | macOS | `Mark-Lee_*_aarch64.dmg` | Apple Silicon |
            | Linux | `Mark-Lee_*_amd64.AppImage` | Portable application |
            | Debian/Ubuntu | `Mark-Lee_*_amd64.deb` | Native package |
            | Fedora/RHEL | `Mark-Lee-*.x86_64.rpm` | Native package |
          releaseDraft: false
          prerelease: false

  release-macos-dmg:
    name: Optional macOS DMG (non-blocking)
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build and attach DMG (optional)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles dmg
          tagName: ${{ github.ref_name }}
          releaseName: 'Mark-Lee v__VERSION__'
          releaseBody: |
            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/apps/site/public/assets/product/og-mark-lee.png" alt="Mark-Lee Editor e Memórias" width="960">
            </p>

            Mark-Lee reúne um editor Markdown e um espaço local-first de Memórias sobre os mesmos arquivos.

            ## Downloads

            | Platform | Recommended file | Use |
            | --- | --- | --- |
            | Windows | `Mark-Lee_*_x64-setup.exe` | Standard installation |
            | Windows | `Mark-Lee_*_x64_en-US.msi` | Managed deployment |
            | macOS | `Mark-Lee_*_aarch64.dmg` | Apple Silicon |
            | Linux | `Mark-Lee_*_amd64.AppImage` | Portable application |
            | Debian/Ubuntu | `Mark-Lee_*_amd64.deb` | Native package |
            | Fedora/RHEL | `Mark-Lee-*.x86_64.rpm` | Native package |
          releaseDraft: false
          prerelease: false

      - name: Collect DMG bundle logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/mark-lee-dmg-logs
          if [ -d "src-tauri/target/release/bundle/dmg" ]; then
            cp -R src-tauri/target/release/bundle/dmg /tmp/mark-lee-dmg-logs/
          fi
          if [ -f "src-tauri/target/release/bundle/dmg/bundle_dmg.sh" ]; then
            cp src-tauri/target/release/bundle/dmg/bundle_dmg.sh /tmp/mark-lee-dmg-logs/
          fi

      - name: Upload DMG failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-bundle-logs-${{ github.run_id }}
          path: /tmp/mark-lee-dmg-logs
          if-no-files-found: ignore
