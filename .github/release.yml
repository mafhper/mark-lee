changelog:
  exclude:
    labels:
      - dependencies
      - ignore-for-release
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Novidades e melhorias
      labels:
        - enhancement
        - feature
    - title: Correções
      labels:
        - bug
    - title: Outras mudanças
      labels:
        - "*"