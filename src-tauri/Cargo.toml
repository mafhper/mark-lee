[package]
name = "mark-lee-desktop"
version = "1.8.4"
description = "A Mark-Lee App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mark_lee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
tauri-plugin-fs = "2"
base64 = "0.23"
notify = "8"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# Updater assinado (ML-H06): checagem e download no cliente; a instalação só
# entra depois do preflight do `LifecycleCoordinator`.
tauri-plugin-updater = "2"

# Troca de destino no Windows: `ReplaceFileW` preserva ACL/atributos do arquivo
# substituído, o que `std::fs::rename` não expõe.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
